name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
      NEXT_PUBLIC_SITE_URL: https://example.com
      APP_URL: https://example.com
      AWS_REGION: us-east-1
      FREE_CREDIT_IDENTITY_SALT: ci-placeholder-free-credit-salt
      FREE_CREDITS_TOTAL: "100"
      FREE_CREDITS_COST_SEARCH: "10"
      FREE_CREDITS_COST_EXPLAIN: "1"
      GDPR_DEFAULT_REGION: eu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
